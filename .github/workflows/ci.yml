name: peerdeal-ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  bootstrap-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Boundary checks
        run: python3 scripts/check_package_boundaries.py

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test
