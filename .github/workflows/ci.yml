name: peerdeal-ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  bootstrap-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install workspace dependencies
        run: dart pub get

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Boundary checks
        run: dart run melos run boundary-check

      - name: Boundary checker tests
        run: dart run melos run boundary-check:test

      - name: Dependency audit
        run: dart run melos run dependency-audit

      - name: Dependency audit tests
        run: dart run melos run dependency-audit:test

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test
