name: peerdeal-ci

on:
  pull_request:
  push:
    branches: [ main, master, 'retrofit/**', 'hardening/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peerdeal-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.8'

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Boundary checks
        run: dart run melos run boundary-check

      - name: Boundary checker tests
        run: dart run melos run boundary-check:test

      - name: Dependency audit
        run: dart run melos run dependency-audit

      - name: Dependency audit tests
        run: dart run melos run dependency-audit:test

      - name: Source text hygiene
        run: dart run melos run source-text

      - name: Source text checker tests
        run: dart run melos run source-text:test

      - name: Native contract bound check
        run: dart run melos run native-contract-check

      - name: Native contract bound checker tests
        run: dart run melos run native-contract-check:test

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test

  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.8'

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build Android debug APK
        working-directory: apps/peerdeal_mobile
        run: flutter build apk --debug --no-pub

      - name: Verify Android release signing fails closed
        working-directory: apps/peerdeal_mobile
        env:
          PEERDEAL_ANDROID_KEYSTORE: ''
          PEERDEAL_ANDROID_KEYSTORE_PASSWORD: ''
          PEERDEAL_ANDROID_KEY_ALIAS: ''
          PEERDEAL_ANDROID_KEY_PASSWORD: ''
        shell: bash
        run: |
          set +e
          output="$(flutter build apk --release --no-pub 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Android release build unexpectedly succeeded without signing credentials."
            exit 1
          fi
          if ! grep -Fq "Android release builds require all four PEERDEAL_ANDROID_* signing values" <<<"$output"; then
            echo "Android release build failed without the expected signing guard diagnostic."
            exit 1
          fi

      - name: Create ephemeral Android release signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/peerdeal-ci-release.p12"
          password='peerdeal-ci-only'
          keytool -genkeypair -noprompt \
            -keystore "$keystore" \
            -storetype PKCS12 \
            -storepass "$password" \
            -keypass "$password" \
            -alias peerdeal-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=PeerDeal CI, OU=CI, O=PeerDeal, L=Local, S=Local, C=US"
          {
            printf 'PEERDEAL_ANDROID_KEYSTORE=%s\n' "$keystore"
            printf 'PEERDEAL_ANDROID_KEYSTORE_PASSWORD=%s\n' "$password"
            printf 'PEERDEAL_ANDROID_KEY_ALIAS=peerdeal-ci\n'
            printf 'PEERDEAL_ANDROID_KEY_PASSWORD=%s\n' "$password"
          } >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        working-directory: apps/peerdeal_mobile
        run: flutter build apk --release --no-pub

      - name: Verify signed Android release APK
        working-directory: apps/peerdeal_mobile
        shell: bash
        run: |
          set -euo pipefail
          apk="$PWD/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Android release APK was not produced."
            exit 1
          fi
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
            echo "Android SDK build-tools directory is unavailable."
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "Android SDK apksigner is unavailable."
            exit 1
          fi
          if ! verification_output="$("$apksigner" verify --verbose "$apk" 2>&1)"; then
            printf '%s\n' "$verification_output"
            echo "Android release APK signature verification failed."
            exit 1
          fi
          printf '%s\n' "$verification_output"
          if ! grep -Eq 'Verified using v[23] scheme .*: true' <<<"$verification_output"; then
            echo "Android release APK has no verified v2 or v3 signature."
            exit 1
          fi
          if ! grep -Fq 'Number of signers: 1' <<<"$verification_output"; then
            echo "Android release APK does not have exactly one signer."
            exit 1
          fi

  android-native-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.8'

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build Android native host smoke APK
        working-directory: apps/peerdeal_mobile
        run: flutter build apk --debug --no-pub -t tool/android_native_host_smoke.dart

      - name: Install Android emulator image
        shell: bash
        run: |
          set -eu
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create Android emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "no" | avdmanager create avd \
            --force \
            --name peerdeal-api-35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2"

      - name: Run Android native host smoke
        working-directory: apps/peerdeal_mobile
        shell: bash
        run: |
          set -euo pipefail
          emulator_log="$RUNNER_TEMP/peerdeal-android-emulator.log"
          emulator -avd peerdeal-api-35 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$emulator_log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          adb start-server
          device_ready=false
          for attempt in $(seq 1 90); do
            if [ "$(adb get-state 2>/dev/null || true)" = "device" ]; then
              device_ready=true
              break
            fi
            sleep 2
          done
          if [ "$device_ready" != true ]; then
            cat "$emulator_log"
            echo "Android emulator did not connect."
            exit 1
          fi

          boot_completed=0
          for attempt in $(seq 1 90); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            sleep 2
          done
          if [ "$boot_completed" != "1" ]; then
            cat "$emulator_log"
            echo "Android emulator did not finish booting."
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          if ! bash tool/run_android_native_host_smoke.sh; then
            cat "$emulator_log"
            exit 1
          fi

  windows-debug-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.41.8'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Build Windows debug host
        working-directory: apps/peerdeal_desktop
        run: flutter build windows --debug --no-pub

      - name: Build Windows native host runtime smoke
        working-directory: apps/peerdeal_desktop
        run: flutter build windows --debug --no-pub -t tool/windows_native_host_smoke.dart

      - name: Build Windows release host
        working-directory: apps/peerdeal_desktop
        run: flutter build windows --release --no-pub

      - name: Build Windows release native host runtime smoke
        working-directory: apps/peerdeal_desktop
        run: flutter build windows --release --no-pub -t tool/windows_native_host_smoke.dart

      - name: Run Windows debug native host runtime smoke
        working-directory: apps/peerdeal_desktop
        shell: pwsh
        run: ./tool/run_windows_native_host_smoke.ps1

      - name: Run Windows release native host runtime smoke
        working-directory: apps/peerdeal_desktop
        shell: pwsh
        run: ./tool/run_windows_native_host_smoke.ps1 -ExecutablePath .\build\windows\x64\runner\Release\peerdeal_desktop.exe
