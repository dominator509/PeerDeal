name: peerdeal-ci

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  bootstrap-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show tool versions
        run: |
          flutter --version
          dart --version

      - name: Install Melos CLI
        run: |
          dart pub global activate melos 7.8.1
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Bootstrap workspace
        run: dart run melos bootstrap

      - name: Boundary checks
        run: dart run melos run boundary-check

      - name: Boundary checker tests
        run: dart run melos run boundary-check:test

      - name: Dependency audit
        run: dart run melos run dependency-audit

      - name: Dependency audit tests
        run: dart run melos run dependency-audit:test

      - name: Source text hygiene
        run: dart run melos run source-text

      - name: Source text checker tests
        run: dart run melos run source-text:test

      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test
