name: peerdeal_workspace
publish_to: none

environment:
  sdk: '^3.11.5'

workspace:
  - apps/peerdeal_mobile
  - apps/peerdeal_desktop
  - packages/peerdeal_protocol
  - packages/peerdeal_core
  - packages/peerdeal_variants
  - packages/peerdeal_modes
  - packages/peerdeal_crypto
  - packages/peerdeal_network
  - packages/peerdeal_sync
  - packages/peerdeal_replay
  - packages/peerdeal_receipts
  - packages/peerdeal_capture
  - packages/peerdeal_privacy
  - packages/peerdeal_wizard
  - packages/peerdeal_ui_kit
  - packages/peerdeal_native_bridges
  - packages/peerdeal_testkit

dev_dependencies:
  melos: ^8.6.0

melos:
  scripts:
    boundary-check:
      run: python scripts/check_package_boundaries.py
      description: Run package-boundary checks.
    boundary-check:test:
      run: python scripts/test_check_package_boundaries.py
      description: Run package-boundary checker tests.
    dependency-audit:
      run: python scripts/dependency_audit.py
      description: Show dependency versions without changing constraints.
    dependency-audit:test:
      run: python scripts/test_dependency_audit.py
      description: Run dependency-audit script tests.
    source-text:
      run: python scripts/check_source_text.py
      description: Run source text hygiene checks.
    source-text:test:
      run: python scripts/test_check_source_text.py
      description: Run source text checker tests.
    native-contract-check:
      run: python scripts/check_native_contract_bounds.py
      description: Verify Dart and native transport contract bounds stay aligned.
    native-contract-check:test:
      run: python scripts/test_check_native_contract_bounds.py
      description: Run native transport contract bound checker tests.
    analyze:
      run: dart run melos exec -- "dart analyze ."
      description: Analyze Dart packages.
    test:
      run: dart run melos run boundary-check:test && dart run melos run dependency-audit:test && dart run melos run source-text:test && dart run melos run source-text && dart run melos run native-contract-check:test && dart run melos run native-contract-check && dart run melos run test:dart && dart run melos run test:flutter
      description: Run script, Dart, and Flutter tests.
    test:dart:
      run: dart run melos exec --no-flutter --dir-exists=test -- "dart test"
      description: Run tests for non-Flutter Dart packages.
    test:flutter:
      run: dart run melos exec --flutter --dir-exists=test --concurrency=1 -- "flutter test --no-pub"
      description: Run tests for bootstrapped Flutter packages serially.
